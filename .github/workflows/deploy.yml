name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  infra-check:
    name: Infrastructure Pre-check
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check ECR repository exists
        run: |
          if ! aws ecr describe-repositories \
              --repository-names "tech-challenge-catalog-api-repo" \
              --region "${{ secrets.AWS_REGION }}" > /dev/null 2>&1; then
            echo "::error::ECR repository 'tech-challenge-catalog-api-repo' does not exist."
            exit 1
          fi

      - name: Check RDS instance is available
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ vars.AWS_RDS_CATALOG_NAME }}" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" != "available" ]; then
            echo "::error::RDS instance '${{ vars.AWS_RDS_CATALOG_NAME }}' is not available (status: $STATUS)."
            exit 1
          fi

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/tech-challenge-catalog-api-repo:latest \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/tech-challenge-catalog-api-repo:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [infra-check, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name eks-tech-challenge \
            --region "${{ secrets.AWS_REGION }}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR image in kustomize overlay
        run: |
          sed -i "s|ECR_IMAGE|${{ steps.login-ecr.outputs.registry }}/tech-challenge-catalog-api-repo|g" \
            k8s/overlays/aws/kustomization.yaml

      - name: Get RDS endpoint
        id: rds
        run: |
          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "${{ vars.AWS_RDS_CATALOG_NAME }}" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "endpoint=${DB_ENDPOINT}" >> $GITHUB_OUTPUT

      - name: Get SNS and SQS endpoints
        id: aws-resources
        run: |
          SNS_ARN=$(aws sns list-topics \
            --query "Topics[?contains(TopicArn,'catalog-events-topic')].TopicArn | [0]" \
            --output text)
          SQS_URL=$(aws sqs get-queue-url \
            --queue-name "orders-approved-queue" \
            --query QueueUrl --output text 2>/dev/null || echo "")
          echo "sns_arn=${SNS_ARN}" >> $GITHUB_OUTPUT
          echo "sqs_url=${SQS_URL}" >> $GITHUB_OUTPUT

      - name: Generate .env.host
        run: |
          printf 'DB_HOST=%s\nDB_PORT=5432\nDB_USER=%s\nDB_NAME=%s\nDATABASE_URL=postgres://%s:%s@%s:5432/%s?sslmode=require\nAWS_REGION=%s\nHTTP_PORT=8080\nSNS_TOPIC_CATALOG_EVENTS_ARN=%s\nSQS_ORDERS_APPROVED_QUEUE_URL=%s\n' \
            "${{ steps.rds.outputs.endpoint }}" \
            "${{ vars.AWS_RDS_DB_USER }}" \
            "${{ vars.AWS_RDS_CATALOG_NAME }}" \
            "${{ vars.AWS_RDS_DB_USER }}" \
            "${{ secrets.AWS_RDS_DB_PASSWORD }}" \
            "${{ steps.rds.outputs.endpoint }}" \
            "${{ vars.AWS_RDS_CATALOG_NAME }}" \
            "${{ secrets.AWS_REGION }}" \
            "${{ steps.aws-resources.outputs.sns_arn }}" \
            "${{ steps.aws-resources.outputs.sqs_url }}" \
            > k8s/overlays/aws/.env.host

      - name: Generate .env.secrets
        run: |
          printf 'DB_PASSWORD=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\nINTERNAL_AUTH_TOKEN=%s\n' \
            "${{ secrets.AWS_RDS_DB_PASSWORD }}" \
            "${{ secrets.AWS_ACCESS_KEY_ID }}" \
            "${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            "${{ secrets.AWS_SESSION_TOKEN }}" \
            "${{ secrets.INTERNAL_AUTH_TOKEN }}" \
            > k8s/overlays/aws/.env.secrets

      - name: Apply kustomize overlay to EKS
        run: kubectl apply -k k8s/overlays/aws/

      - name: Restart deployment to pull new image
        run: kubectl rollout restart deployment/catalog-api

      - name: Verify deployment rollout
        run: kubectl rollout status deployment/catalog-api --timeout=120s
